name: Update Registry Metadata

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write

# Never run concurrently with discovery — both rewrite the registry.
concurrency:
  group: registry-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Fetch live metadata for all repos
        id: refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-metadata.mjs

      - name: Commit if changed
        env:
          RENAMED: ${{ steps.refresh.outputs.renamed }}
          DROPPED: ${{ steps.refresh.outputs.dropped }}
        run: |
          if git diff --quiet Sources/Resources/tracker-registry.json; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Sources/Resources/tracker-registry.json
            # Renames rewrite entries and dropped duplicates delete them — say
            # so, or they hide in history among routine stat refreshes.
            MESSAGE="Update registry metadata"
            if [ "${RENAMED:-0}" -gt 0 ] || [ "${DROPPED:-0}" -gt 0 ]; then
              MESSAGE="$MESSAGE ($RENAMED renamed, $DROPPED duplicates dropped)"
            fi
            git commit -m "$MESSAGE"
            for i in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase origin main || { git rebase --abort; exit 1; }
              sleep 10
            done
            exit 1
          fi
