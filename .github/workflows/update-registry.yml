name: Update Registry Metadata

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write

# Never run concurrently with discovery — both rewrite the registry.
concurrency:
  group: registry-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch live metadata for all repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-metadata.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet Sources/Resources/tracker-registry.json; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Sources/Resources/tracker-registry.json
            git commit -m "Update registry metadata"
            for i in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase origin main || { git rebase --abort; exit 1; }
              sleep 10
            done
            exit 1
          fi
